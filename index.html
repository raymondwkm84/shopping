<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WA14 零食罐頭防伏管家 (100% 免費免 API Key 版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif; background-color: #f3f4f6; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24 text-gray-800 select-none">

  <!-- Top Header -->
  <header class="bg-emerald-600 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-tight flex items-center gap-1.5">
          <span>🥫</span> 零食罐頭防伏管家
        </h1>
        <p class="text-[11px] text-emerald-100">100% 免費免 API Key · 零留相極省空間 · 英國 £</p>
      </div>
      <button onclick="openSyncModal()" class="bg-emerald-700 hover:bg-emerald-800 px-2.5 py-1.5 rounded-lg text-xs font-medium border border-emerald-500">
        🔄 家庭碼: <span id="headerFamilyCode" class="font-mono font-bold text-amber-300">WA14</span>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="max-w-md mx-auto px-4 pb-3">
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderList()" placeholder="搜尋牌子、罐頭、Tesco / Aldi、或「伏」..."
          class="w-full pl-9 pr-8 py-2 rounded-xl text-sm text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-amber-300 shadow-inner" />
        <span class="absolute left-3 top-2.5 text-gray-400 text-sm">🔍</span>
        <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-2.5 top-2 text-gray-400 text-sm">✕</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto px-4 pt-3">
    <div class="flex bg-gray-200 p-1 rounded-xl mb-3 text-sm font-medium">
      <button id="tabStock" onclick="switchTab('stock')" class="flex-1 py-1.5 rounded-lg bg-white text-emerald-700 shadow-sm transition">
        🏠 屋企存貨 (<span id="countStock">0</span>)
      </button>
      <button id="tabHistory" onclick="switchTab('history')" class="flex-1 py-1.5 rounded-lg text-gray-600 transition">
        📝 食完/防伏紀錄 (<span id="countHistory">0</span>)
      </button>
    </div>

    <!-- Filter Pills -->
    <div id="filterPills" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-2 text-xs">
      <button onclick="setFilter('all')" data-filter="all" class="filter-pill bg-emerald-600 text-white px-3 py-1 rounded-full whitespace-nowrap font-medium">全部存貨</button>
      <button onclick="setFilter('expiring')" data-filter="expiring" class="filter-pill bg-white text-gray-600 border px-3 py-1 rounded-full whitespace-nowrap">⚠️ 就快過期 (14日內)</button>
      <button onclick="setFilter('expired')" data-filter="expired" class="filter-pill bg-white text-gray-600 border px-3 py-1 rounded-full whitespace-nowrap">🚨 已過期</button>
      <button onclick="setFilter('bad')" data-filter="bad" class="filter-pill bg-white text-gray-600 border px-3 py-1 rounded-full whitespace-nowrap">❌ 中伏負評</button>
    </div>

    <!-- Storage Indicator -->
    <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-1.5 mb-3 flex items-center justify-between text-[11px] text-emerald-800">
      <span>💾 純文字儲存（完全免付費、零相片佔用）</span>
      <span id="storageSize" class="font-mono font-bold">0.4 KB</span>
    </div>

    <div id="itemList" class="space-y-2.5"></div>
  </main>

  <!-- Floating Bottom Buttons -->
  <div class="fixed bottom-4 left-0 right-0 z-20 px-4">
    <div class="max-w-md mx-auto flex gap-2.5">
      <button onclick="openAddModal(false)" class="flex-1 bg-white border-2 border-emerald-600 text-emerald-700 font-bold py-3 rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center gap-1.5 text-sm">
        <span>✍️</span> 手動 / 貼上入貨
      </button>
      <button onclick="openAddModal(true)" class="flex-[1.5] bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3 rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center gap-1.5 text-sm">
        <span>📷</span> 免費掃碼 / 照日期
      </button>
    </div>
  </div>

  <!-- Hidden Native Camera Input for Offline Enhanced Date OCR -->
  <input type="file" id="offlineDateCam" accept="image/*" capture="environment" class="hidden" onchange="handleOfflineDatePhoto(event)" />

  <!-- Global Loading Overlay -->
  <div id="globalLoading" class="fixed inset-0 bg-black/75 z-50 hidden flex flex-col items-center justify-center text-white p-6 text-center">
    <div class="w-12 h-12 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mb-3"></div>
    <p id="loadingTitle" class="text-base font-bold text-emerald-300 mb-1">正在用本地離線引擎辨識日期...</p>
    <p class="text-xs text-gray-300">完全免費免連網，讀取後即刻銷毀暫存畫面</p>
  </div>

  <!-- Add / Edit Modal -->
  <div id="itemModal" class="fixed inset-0 bg-black/60 z-40 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[94vh] overflow-y-auto p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h2 id="modalTitle" class="text-lg font-bold text-gray-800">新增 / 編輯貨品</h2>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-2">✕</button>
      </div>

      <!-- Free Offline Tools Bar -->
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button type="button" onclick="toggleBarcodeBox()" class="bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-500 text-emerald-800 p-2.5 rounded-2xl flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <span class="text-lg">🔍</span>
          <span class="text-xs font-bold">免費掃條碼 (Barcode)</span>
          <span class="text-[10px] text-emerald-600">自動查全球食品庫</span>
        </button>
        <button type="button" onclick="triggerOfflineDateCam()" class="bg-amber-50 hover:bg-amber-100 border-2 border-amber-500 text-amber-900 p-2.5 rounded-2xl flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <span class="text-lg">📅</span>
          <span class="text-xs font-bold">離線照罐底讀日期</span>
          <span class="text-[10px] text-amber-700">黑白高對比濾鏡強化</span>
        </button>
      </div>

      <!-- Barcode Live Reader Container (Collapsible) -->
      <div id="barcodeSection" class="hidden mb-3 bg-gray-900 rounded-2xl overflow-hidden border-2 border-emerald-500">
        <div id="barcodeReader" class="w-full h-44 bg-black"></div>
        <div class="bg-gray-800 px-3 py-1.5 flex justify-between items-center text-[11px] text-gray-300">
          <span id="barcodeHint">對準條碼；若無資料可用下面「智能貼上」</span>
          <button type="button" onclick="stopBarcodeScanner()" class="text-red-400 underline">關閉</button>
        </div>
      </div>

      <!-- Smart Paste Box (Works with iPhone Live Text / Android Google Lens / Free Gemini App) -->
      <div class="mb-3 bg-indigo-50 border border-indigo-200 rounded-2xl p-3">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-indigo-900">⚡ 智能貼上解析（配合手機自帶相機複製文字）</label>
          <button type="button" onclick="pasteFromClipboard()" class="bg-indigo-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg active:scale-95">📋 一鍵貼上</button>
        </div>
        <textarea id="smartPasteInput" rows="2" oninput="parseSmartText(this.value)"
          placeholder="用手機相機對住罐頭/包裝長按複製文字，或者貼上收據文字，自動拆解名稱、價錢 £ 同到期日..."
          class="w-full border border-indigo-200 rounded-xl px-2.5 py-1.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
      </div>

      <!-- Warning / History Alert -->
      <div id="historyWarningBanner" class="hidden mb-3 p-3 rounded-xl border text-xs"></div>

      <!-- Form -->
      <form id="itemForm" onsubmit="saveItem(event)" class="space-y-3">
        <input type="hidden" id="editId" />
        <input type="hidden" id="itemBarcode" />

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-600 mb-1">零食 / 罐頭名稱 *</label>
            <input type="text" id="itemName" required oninput="checkPreviousHistory(this.value)" placeholder="輸入名稱或掃條碼/貼上文字"
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
          <div class="w-20">
            <label class="block text-xs font-bold text-gray-600 mb-1">數量</label>
            <input type="number" id="itemQty" value="1" min="0"
              class="w-full border border-gray-300 rounded-xl px-2 py-2 text-sm text-center font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>

        <!-- Expiry Date -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-gray-600">到期日 (Best Before / Use By) *</label>
            <span id="rawDateDetected" class="text-[11px] text-amber-600 font-bold"></span>
          </div>
          <input type="date" id="itemExpiry" required
            class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none mb-1.5" />
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar text-[11px]">
            <button type="button" onclick="addDaysToExpiry(3)" class="bg-gray-100 px-2.5 py-1 rounded-lg font-medium">+3日</button>
            <button type="button" onclick="addDaysToExpiry(14)" class="bg-gray-100 px-2.5 py-1 rounded-lg font-medium">+2星期</button>
            <button type="button" onclick="addMonthsToExpiry(1)" class="bg-gray-100 px-2.5 py-1 rounded-lg font-medium">+1個月</button>
            <button type="button" onclick="addMonthsToExpiry(6)" class="bg-gray-100 px-2.5 py-1 rounded-lg font-medium">+6個月</button>
            <button type="button" onclick="addMonthsToExpiry(12)" class="bg-gray-100 px-2.5 py-1 rounded-lg font-medium">+1年</button>
            <button type="button" onclick="addMonthsToExpiry(24)" class="bg-gray-100 px-2.5 py-1 rounded-lg font-medium">+2年</button>
          </div>
        </div>

        <!-- Price & Store -->
        <div class="flex gap-2">
          <div class="w-28">
            <label class="block text-xs font-bold text-gray-600 mb-1">買入價錢 (£)</label>
            <div class="relative">
              <span class="absolute left-3 top-2 text-gray-500 text-sm font-bold">£</span>
              <input type="number" step="0.01" id="itemPrice" placeholder="1.50"
                class="w-full border border-gray-300 rounded-xl pl-7 pr-2 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-600 mb-1">係邊買 (英國超市)</label>
            <input type="text" id="itemStore" placeholder="揀下面或自己打..."
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>

        <!-- UK WA14 Store Pills -->
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar text-[11px] pb-1">
          <button type="button" onclick="setStore('Tesco')" class="bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-full whitespace-nowrap">Tesco</button>
          <button type="button" onclick="setStore('Sainsbury\'s')" class="bg-orange-50 text-orange-700 border border-orange-200 px-2.5 py-1 rounded-full whitespace-nowrap">Sainsbury's</button>
          <button type="button" onclick="setStore('M&S')" class="bg-gray-100 text-gray-800 border border-gray-300 px-2.5 py-1 rounded-full whitespace-nowrap">M&S</button>
          <button type="button" onclick="setStore('Waitrose')" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full whitespace-nowrap">Waitrose</button>
          <button type="button" onclick="setStore('Aldi')" class="bg-sky-50 text-sky-700 border border-sky-200 px-2.5 py-1 rounded-full whitespace-nowrap">Aldi</button>
          <button type="button" onclick="setStore('Lidl')" class="bg-yellow-50 text-yellow-800 border border-yellow-300 px-2.5 py-1 rounded-full whitespace-nowrap">Lidl</button>
          <button type="button" onclick="setStore('Asda')" class="bg-lime-50 text-lime-700 border border-lime-200 px-2.5 py-1 rounded-full whitespace-nowrap">Asda</button>
          <button type="button" onclick="setStore('Morrisons')" class="bg-green-50 text-green-700 border border-green-200 px-2.5 py-1 rounded-full whitespace-nowrap">Morrisons</button>
          <button type="button" onclick="setStore('Boots')" class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-full whitespace-nowrap">Boots</button>
          <button type="button" onclick="setStore('中超/韓超')" class="bg-red-50 text-red-700 border border-red-200 px-2.5 py-1 rounded-full whitespace-nowrap">中超/韓超</button>
        </div>

        <!-- Rating -->
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">好唔好食評價（防中伏標記）</label>
          <div class="grid grid-cols-3 gap-2 text-xs font-bold">
            <button type="button" onclick="setRating('unrated')" id="rate-unrated" class="rate-btn py-2 rounded-xl border-2 border-gray-300 bg-gray-100 text-gray-700">🤔 未試食</button>
            <button type="button" onclick="setRating('good')" id="rate-good" class="rate-btn py-2 rounded-xl border border-gray-200 bg-white text-gray-600">😋 好食推介</button>
            <button type="button" onclick="setRating('bad')" id="rate-bad" class="rate-btn py-2 rounded-xl border border-gray-200 bg-white text-gray-600">❌ 伏！唔好買</button>
          </div>
          <input type="hidden" id="itemRating" value="unrated" />
        </div>

        <!-- Note -->
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">食評 / 產品備註</label>
          <input type="text" id="itemNote" placeholder="例如：原味午餐肉 340g、減價先買、太鹹唔好食..."
            class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeAddModal()" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">取消</button>
          <button type="submit" class="flex-[2] py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow-md">💾 儲存純文字紀錄</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Family Sync Modal -->
  <div id="syncModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-bold text-gray-800">🔄 多部手機同步設定</h3>
        <button onclick="closeSyncModal()" class="text-gray-400 font-bold text-lg">✕</button>
      </div>
      <div class="mb-3">
        <label class="block text-xs font-bold text-gray-600 mb-1">家庭同步碼</label>
        <div class="flex gap-2">
          <input type="text" id="familyCodeInput" class="flex-1 border border-gray-300 rounded-xl px-3 py-2 text-sm font-mono uppercase font-bold" />
          <button onclick="saveFamilyCode()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold">套用</button>
        </div>
      </div>
      <div class="border-t pt-3 mt-3">
        <p class="text-[11px] text-gray-500 mb-2">📲 傳送純文字同步碼給屋企人（WhatsApp 複製貼上）：</p>
        <div class="flex gap-2">
          <button onclick="exportDataString()" class="flex-1 bg-amber-500 text-white py-2 rounded-xl text-xs font-bold">📤 複製同步字串</button>
          <button onclick="importDataString()" class="flex-1 bg-gray-700 text-white py-2 rounded-xl text-xs font-bold">📥 貼上匯入</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'stock';
    let currentFilter = 'all';
    let familyCode = localStorage.getItem('wa14_family_code') || 'WA14';
    let html5QrCode = null;

    const defaultItems = [
      {
        id: '1',
        barcode: '5000112637922',
        name: 'M&S 牛奶朱古力消化餅',
        qty: 2,
        expiry: getFutureDate(45),
        price: '1.65',
        store: 'M&S',
        rating: 'good',
        note: 'Altrincham 分店買，配茶一流，必回購'
      },
      {
        id: '2',
        barcode: '',
        name: '特價茄汁豆罐頭',
        qty: 1,
        expiry: getFutureDate(5),
        price: '0.45',
        store: 'Aldi',
        rating: 'bad',
        note: '❌ 伏！汁太稀唔好食，下次買返 Heinz'
      }
    ];

    function getStorageKey() { return `wa14_pantry_items_${familyCode}`; }
    function getItems() {
      const raw = localStorage.getItem(getStorageKey());
      if (!raw) {
        localStorage.setItem(getStorageKey(), JSON.stringify(defaultItems));
        return defaultItems;
      }
      return JSON.parse(raw);
    }
    function saveItemsToStorage(items) {
      localStorage.setItem(getStorageKey(), JSON.stringify(items));
      updateStorageSize();
      renderList();
    }
    function getFutureDate(days) {
      const d = new Date(); d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }
    function updateStorageSize() {
      const raw = localStorage.getItem(getStorageKey()) || '[]';
      document.getElementById('storageSize').textContent = `${(new Blob([raw]).size / 1024).toFixed(2)} KB`;
    }

    // --- 1. Free Barcode Scanner (Open Food Facts) ---
    function toggleBarcodeBox() {
      const box = document.getElementById('barcodeSection');
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        startBarcodeScanner();
      } else {
        stopBarcodeScanner();
      }
    }

    function startBarcodeScanner() {
      html5QrCode = new Html5Qrcode("barcodeReader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 100 } },
        async (decodedText) => {
          if (navigator.vibrate) navigator.vibrate(100);
          document.getElementById('itemBarcode').value = decodedText;
          checkPreviousHistory(decodedText);
          stopBarcodeScanner();

          const localMatch = getItems().find(i => i.barcode === decodedText);
          if (localMatch) {
            document.getElementById('itemName').value = localMatch.name;
            return;
          }

          document.getElementById('itemName').value = `查詢條碼 ${decodedText}...`;
          try {
            const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
            const data = await res.json();
            if (data.status === 1 && data.product && data.product.product_name) {
              const brand = data.product.brands ? `${data.product.brands} ` : '';
              const qty = data.product.quantity ? ` (${data.product.quantity})` : '';
              document.getElementById('itemName').value = `${brand}${data.product.product_name}`;
              if (qty && !document.getElementById('itemNote').value) {
                document.getElementById('itemNote').value = qty.trim();
              }
            } else {
              document.getElementById('itemName').value = '';
              alert('⚠️ 免費條碼庫暫時未有呢款貨（可能係中超或新出零食），你可以用手機相機對住包裝複製文字，貼入下面紫色「智能貼上解析框」就自動填好！');
            }
          } catch {
            document.getElementById('itemName').value = '';
          }
        },
        () => {}
      ).catch(() => {
        document.getElementById('barcodeHint').textContent = '⚠️ 需透過 HTTPS 網址開相機，或直接用下方智能貼上';
      });
    }

    async function stopBarcodeScanner() {
      if (html5QrCode) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      }
      document.getElementById('barcodeSection').classList.add('hidden');
    }

    // --- 2. Free Offline High-Contrast Date OCR (No API Key, No Cost) ---
    function triggerOfflineDateCam() {
      const input = document.getElementById('offlineDateCam');
      input.value = '';
      input.click();
    }

    async function handleOfflineDatePhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('globalLoading').classList.remove('hidden');
      try {
        const processedDataUrl = await enhanceMetalCanContrast(file);
        event.target.value = '';

        const { data: { text } } = await Tesseract.recognize(processedDataUrl, 'eng');
        const parsedDate = extractDateFromText(text);

        if (parsedDate) {
          if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
          document.getElementById('itemExpiry').value = parsedDate;
          document.getElementById('rawDateDetected').textContent = `✅ 離線讀到: ${parsedDate}`;
        } else {
          // Put whatever raw text was read into smart paste box so user can see/adjust
          const cleanRaw = text.replace(/\s+/g, ' ').trim();
          alert(`⚠️ 罐底反光太強未能自動轉成日期。\n\n離線引擎見到嘅字：「${cleanRaw || '無清晰文字'}」\n💡 建議小技巧：直接用你手機自帶相機/相簿長按罐底日期「複製文字」，再撳「📋 一鍵貼上」就會自動填好！`);
        }
      } catch (err) {
        alert('讀取失敗：' + err.message);
      } finally {
        document.getElementById('globalLoading').classList.add('hidden');
      }
    }

    // Black & White High-Contrast Binarization Filter for Metal Cans
    function enhanceMetalCanContrast(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            // Crop center 70% where user aims the date
            const cropW = img.width * 0.75;
            const cropH = img.height * 0.45;
            const startX = (img.width - cropW) / 2;
            const startY = (img.height - cropH) / 2;

            const scale = Math.min(1, 1000 / cropW);
            canvas.width = cropW * scale;
            canvas.height = cropH * scale;
            const ctx = canvas.getContext('2d');
            ctx.filter = 'grayscale(100%) contrast(220%) brightness(110%)';
            ctx.drawImage(img, startX, startY, cropW, cropH, 0, 0, canvas.width, canvas.height);

            const out = canvas.toDataURL('image/jpeg', 0.85);
            canvas.width = 0; canvas.height = 0;
            resolve(out);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // --- 3. Smart Paste Parser (Works with iPhone Live Text / Google Lens / Free Gemini App) ---
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (!text) {
          alert('剪貼簿入面暫時無文字，請先喺手機相簿或 Gemini App 複製文字再撳！');
          return;
        }
        document.getElementById('smartPasteInput').value = text;
        parseSmartText(text);
      } catch {
        alert('請直接長按下面輸入框揀「貼上」即可自動解析！');
      }
    }

    function parseSmartText(raw) {
      if (!raw || !raw.trim()) return;

      // 1. Extract Date if present
      const detectedDate = extractDateFromText(raw);
      if (detectedDate) {
        document.getElementById('itemExpiry').value = detectedDate;
        document.getElementById('rawDateDetected').textContent = `✅ 已自動抽出日期`;
      }

      // 2. Extract UK Price (£1.50 or 1.50)
      const priceMatch = raw.match(/£\s*(\d+(?:\.\d{1,2})?)/);
      if (priceMatch) {
        document.getElementById('itemPrice').value = priceMatch[1];
      }

      // 3. Extract UK Store name if mentioned
      const stores = ['Tesco', 'Sainsbury', 'M&S', 'Waitrose', 'Aldi', 'Lidl', 'Asda', 'Morrisons', 'Boots'];
      for (const s of stores) {
        if (raw.toLowerCase().includes(s.toLowerCase())) {
          document.getElementById('itemStore').value = s === 'Sainsbury' ? "Sainsbury's" : s;
          break;
        }
      }

      // 4. Extract Product Name (First meaningful line that isn't just a date or price)
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length >= 2);
      for (const line of lines) {
        // Skip lines that are purely dates or store names
        if (/^(best before|use by|exp|bb|bbe|\d+[\/\-\.]\d+)/i.test(line)) continue;
        if (!document.getElementById('itemName').value) {
          document.getElementById('itemName').value = line.slice(0, 45);
          checkPreviousHistory(line);
          break;
        }
      }
    }

    function extractDateFromText(rawText) {
      const text = rawText.toUpperCase().replace(/\s+/g, ' ');
      const months = { JAN: '01', FEB: '02', MAR: '03', APR: '04', MAY: '05', JUN: '06', JUL: '07', AUG: '08', SEP: '09', OCT: '10', NOV: '11', DEC: '12' };

      // 1. YYYY-MM-DD or YYYY/MM/DD or YYYY.MM.DD
      let m = text.match(/(202[5-9]|203[0-5])[\/\-\.\s](0[1-9]|1[0-2])[\/\-\.\s](0[1-9]|[12][0-9]|3[01])/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;

      // 2. DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY or DD MM YYYY (UK format)
      m = text.match(/(0[1-9]|[12][0-9]|3[01])[\/\-\.\s](0[1-9]|1[0-2])[\/\-\.\s](202[5-9]|203[0-5])/);
      if (m) return `${m[3]}-${m[2]}-${m[1]}`;

      // 3. DD/MM/YY (e.g. 15/06/27 or 15 06 27)
      m = text.match(/(0[1-9]|[12][0-9]|3[01])[\/\-\.\s](0[1-9]|1[0-2])[\/\-\.\s](2[5-9]|3[0-5])\b/);
      if (m) return `20${m[3]}-${m[2]}-${m[1]}`;

      // 4. DD MMM YYYY or MMM YYYY or MMM YY (e.g. 12 OCT 2027, OCT 2027, OCT 27)
      m = text.match(/(?:(0[1-9]|[12][0-9]|3[01])\s*)?(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s*(202[5-9]|203[0-5]|2[5-9]|3[0-5])\b/);
      if (m) {
        const day = m[1] || '28';
        const yr = m[3].length === 2 ? `20${m[3]}` : m[3];
        return `${yr}-${months[m[2]]}-${day}`;
      }

      // 5. MM/YYYY or MM/YY (e.g. 08/2027 or 08/27)
      m = text.match(/(0[1-9]|1[0-2])[\/\-\.](202[5-9]|203[0-5]|2[5-9]|3[0-5])\b/);
      if (m) {
        const yr = m[2].length === 2 ? `20${m[2]}` : m[2];
        return `${yr}-${m[1]}-28`;
      }

      return null;
    }

    // --- UI & Form Helpers ---
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabStock').className = tab === 'stock' ? 'flex-1 py-1.5 rounded-lg bg-white text-emerald-700 shadow-sm transition' : 'flex-1 py-1.5 rounded-lg text-gray-600 transition';
      document.getElementById('tabHistory').className = tab === 'history' ? 'flex-1 py-1.5 rounded-lg bg-white text-emerald-700 shadow-sm transition' : 'flex-1 py-1.5 rounded-lg text-gray-600 transition';
      document.getElementById('filterPills').style.display = tab === 'stock' ? 'flex' : 'none';
      renderList();
    }
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.className = btn.dataset.filter === filter
          ? 'filter-pill bg-emerald-600 text-white px-3 py-1 rounded-full whitespace-nowrap font-medium'
          : 'filter-pill bg-white text-gray-600 border px-3 py-1 rounded-full whitespace-nowrap';
      });
      renderList();
    }
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderList();
    }
    function getDaysLeft(expiryStr) {
      if (!expiryStr) return 999;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      return Math.ceil((new Date(expiryStr) - today) / (1000 * 60 * 60 * 24));
    }
    function renderList() {
      const items = getItems();
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !query);

      const stockItems = items.filter(i => Number(i.qty) > 0);
      const historyItems = items.filter(i => Number(i.qty) <= 0);
      document.getElementById('countStock').textContent = stockItems.length;
      document.getElementById('countHistory').textContent = historyItems.length;

      let displayList = currentTab === 'stock' ? stockItems : historyItems;
      if (currentTab === 'stock') {
        displayList.sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
        if (currentFilter === 'expiring') displayList = displayList.filter(i => { const d = getDaysLeft(i.expiry); return d >= 0 && d <= 14; });
        if (currentFilter === 'expired') displayList = displayList.filter(i => getDaysLeft(i.expiry) < 0);
        if (currentFilter === 'bad') displayList = displayList.filter(i => i.rating === 'bad');
      }
      if (query) {
        displayList = displayList.filter(i =>
          (i.name && i.name.toLowerCase().includes(query)) ||
          (i.store && i.store.toLowerCase().includes(query)) ||
          (i.note && i.note.toLowerCase().includes(query)) ||
          (query === '伏' && i.rating === 'bad')
        );
      }

      const container = document.getElementById('itemList');
      if (displayList.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">暫時未有相關紀錄，撳下面「📷 免費掃碼 / 照日期」試下！</div>`;
        return;
      }

      container.innerHTML = displayList.map(item => {
        const days = getDaysLeft(item.expiry);
        let badgeHtml = '';
        let cardBorder = 'border-gray-200';
        if (currentTab === 'stock') {
          if (days < 0) {
            badgeHtml = `<span class="bg-red-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-md">🚨 已過期 ${Math.abs(days)} 日</span>`;
            cardBorder = 'border-red-400 bg-red-50/40';
          } else if (days <= 14) {
            badgeHtml = `<span class="bg-amber-500 text-white text-[11px] font-bold px-2 py-0.5 rounded-md">⚠️ 剩 ${days} 日過期</span>`;
            cardBorder = 'border-amber-300 bg-amber-50/30';
          } else {
            badgeHtml = `<span class="bg-emerald-100 text-emerald-800 text-[11px] font-medium px-2 py-0.5 rounded-md">剩 ${days} 日 (${item.expiry})</span>`;
          }
        } else {
          badgeHtml = `<span class="bg-gray-200 text-gray-600 text-[11px] px-2 py-0.5 rounded-md">已食完歸檔</span>`;
        }

        let ratingBadge = item.rating === 'bad'
          ? `<span class="bg-red-100 text-red-700 border border-red-300 text-[11px] font-bold px-2 py-0.5 rounded-md">❌ 伏！唔好買</span>`
          : (item.rating === 'good' ? `<span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2 py-0.5 rounded-md">😋 好食</span>` : '');

        return `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border ${cardBorder}">
            <div class="flex justify-between items-start gap-2">
              <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-1.5 mb-1">${badgeHtml}${ratingBadge}</div>
                <h3 class="font-bold text-gray-900 text-base truncate">${escapeHtml(item.name)}</h3>
                <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500 mt-1">
                  ${item.store ? `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-medium">📍 ${escapeHtml(item.store)}</span>` : ''}
                  ${item.price ? `<span class="font-mono font-bold text-gray-700">💷 £${escapeHtml(item.price)}</span>` : ''}
                  ${item.expiry ? `<span>📅 ${item.expiry}</span>` : ''}
                </div>
                ${item.note ? `<p class="mt-1.5 text-xs ${item.rating === 'bad' ? 'text-red-600 font-medium' : 'text-gray-600'} bg-gray-50 px-2.5 py-1.5 rounded-lg">💬 ${escapeHtml(item.note)}</p>` : ''}
              </div>
              <div class="flex flex-col items-end justify-between gap-2">
                <div class="flex items-center bg-gray-100 rounded-xl p-0.5 border">
                  <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center font-bold text-gray-600">−</button>
                  <span class="w-7 text-center font-bold text-sm">${item.qty}</span>
                  <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center font-bold text-emerald-700">+</button>
                </div>
                <div class="flex gap-2 text-xs text-gray-400">
                  <button onclick="editItem('${item.id}')" class="hover:text-emerald-600 underline">編輯</button>
                  <button onclick="deleteItem('${item.id}')" class="hover:text-red-600 underline">刪除</button>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    }
    function escapeHtml(str) {
      return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) : '';
    }
    function changeQty(id, delta) {
      const items = getItems();
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) { items[idx].qty = Math.max(0, Number(items[idx].qty) + delta); saveItemsToStorage(items); }
    }
    function deleteItem(id) {
      if (confirm('確定徹底刪除？')) saveItemsToStorage(getItems().filter(i => i.id !== id));
    }

    function openAddModal(autoBarcode = false) {
      document.getElementById('itemForm').reset();
      document.getElementById('smartPasteInput').value = '';
      document.getElementById('editId').value = '';
      document.getElementById('itemBarcode').value = '';
      document.getElementById('itemQty').value = '1';
      document.getElementById('itemExpiry').value = getFutureDate(90);
      document.getElementById('rawDateDetected').textContent = '';
      setRating('unrated');
      document.getElementById('historyWarningBanner').classList.add('hidden');
      document.getElementById('itemModal').classList.remove('hidden');

      if (autoBarcode) {
        document.getElementById('barcodeSection').classList.remove('hidden');
        startBarcodeScanner();
      } else {
        document.getElementById('barcodeSection').classList.add('hidden');
      }
    }
    function editItem(id) {
      const item = getItems().find(i => i.id === id);
      if (!item) return;
      openAddModal(false);
      document.getElementById('editId').value = item.id;
      document.getElementById('itemBarcode').value = item.barcode || '';
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemQty').value = item.qty;
      document.getElementById('itemExpiry').value = item.expiry;
      document.getElementById('itemPrice').value = item.price || '';
      document.getElementById('itemStore').value = item.store || '';
      document.getElementById('itemNote').value = item.note || '';
      setRating(item.rating || 'unrated');
    }
    function closeAddModal() {
      stopBarcodeScanner();
      document.getElementById('itemModal').classList.add('hidden');
    }
    function setStore(s) { document.getElementById('itemStore').value = s; }
    function setRating(r) {
      document.getElementById('itemRating').value = r;
      document.querySelectorAll('.rate-btn').forEach(b => b.className = 'rate-btn py-2 rounded-xl border border-gray-200 bg-white text-gray-600');
      const el = document.getElementById(`rate-${r}`);
      if (r === 'unrated') el.className = 'rate-btn py-2 rounded-xl border-2 border-gray-400 bg-gray-100 text-gray-800';
      if (r === 'good') el.className = 'rate-btn py-2 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-700';
      if (r === 'bad') el.className = 'rate-btn py-2 rounded-xl border-2 border-red-500 bg-red-50 text-red-700';
    }
    function addDaysToExpiry(d) { document.getElementById('itemExpiry').value = getFutureDate(d); }
    function addMonthsToExpiry(m) {
      const d = new Date(); d.setMonth(d.getMonth() + m);
      document.getElementById('itemExpiry').value = d.toISOString().split('T')[0];
    }
    function checkPreviousHistory(val) {
      const banner = document.getElementById('historyWarningBanner');
      if (!val || val.length < 2) { banner.classList.add('hidden'); return; }
      const q = val.toLowerCase();
      const match = getItems().find(i => (i.barcode && i.barcode === val) || (i.name && i.name.toLowerCase().includes(q)));
      if (match) {
        banner.classList.remove('hidden');
        banner.className = match.rating === 'bad'
          ? 'mb-3 p-3 rounded-xl border-2 border-red-500 bg-red-50 text-red-800 text-xs'
          : 'mb-3 p-3 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-800 text-xs';
        banner.innerHTML = match.rating === 'bad'
          ? `🚨 <b>防伏警報！你以前標記過呢款中伏！</b><br>上次 <b>${match.store || '未知'}</b> 買 <b>£${match.price || '?'}</b>｜評價：${escapeHtml(match.note || '唔好食')}`
          : `💡 <b>歷史參考：</b>上次 <b>${match.store || '未知'}</b> 買 <b>£${match.price || '?'}</b>｜評價：${escapeHtml(match.note || '')}`;
      } else {
        banner.classList.add('hidden');
      }
    }
    function saveItem(e) {
      e.preventDefault();
      const items = getItems();
      const editId = document.getElementById('editId').value;
      const newItem = {
        id: editId || Date.now().toString(),
        barcode: document.getElementById('itemBarcode').value.trim(),
        name: document.getElementById('itemName').value.trim(),
        qty: Number(document.getElementById('itemQty').value),
        expiry: document.getElementById('itemExpiry').value,
        price: document.getElementById('itemPrice').value.trim(),
        store: document.getElementById('itemStore').value.trim(),
        rating: document.getElementById('itemRating').value,
        note: document.getElementById('itemNote').value.trim()
      };
      if (editId) {
        const idx = items.findIndex(i => i.id === editId);
        if (idx !== -1) items[idx] = newItem;
      } else {
        items.unshift(newItem);
      }
      saveItemsToStorage(items);
      closeAddModal();
    }

    function openSyncModal() {
      document.getElementById('familyCodeInput').value = familyCode;
      document.getElementById('syncModal').classList.remove('hidden');
    }
    function closeSyncModal() { document.getElementById('syncModal').classList.add('hidden'); }
    function saveFamilyCode() {
      const code = document.getElementById('familyCodeInput').value.trim().toUpperCase();
      if (!code) return;
      familyCode = code;
      localStorage.setItem('wa14_family_code', familyCode);
      document.getElementById('headerFamilyCode').textContent = familyCode;
      closeSyncModal();
      renderList();
      updateStorageSize();
    }
    function exportDataString() {
      navigator.clipboard.writeText(btoa(encodeURIComponent(JSON.stringify(getItems())))).then(() => {
        alert('✅ 已複製純文字同步碼！貼上 WhatsApp 發俾屋企人即可。');
      });
    }
    function importDataString() {
      const str = prompt('請貼上屋企人發過嚟嘅同步字串：');
      if (!str) return;
      try {
        const parsed = JSON.parse(decodeURIComponent(atob(str.trim())));
        if (Array.isArray(parsed)) { saveItemsToStorage(parsed); closeSyncModal(); alert(`✅ 成功同步 ${parsed.length} 項紀錄！`); }
      } catch { alert('❌ 格式錯誤'); }
    }

    document.getElementById('headerFamilyCode').textContent = familyCode;
    updateStorageSize();
    renderList();
  </script>
</body>
